services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot
    ports:
      - "5432:5432"
    volumes:
      - finpilot_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend

    env_file:
      - .env

    environment:
      APP_ENV: development
      APP_NAME: FinPilot Assistant API
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://finpilot:finpilot@db:5432/finpilot
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080","http://localhost:62888"]'
      SECRET_KEY: local-development-only
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./database/migrations:/app/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  finpilot_postgres:
